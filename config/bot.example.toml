# Copy to config/bot.toml (git-ignored) and edit.

mode = "paper"            # paper | live. Live never places orders itself: you approve via /trader-broker.
workspace = "runs/paper"  # holds trader/ for this mode; keep paper and live apart

[scan]
min_price = 5
max_candidates = 10          # fresh breakouts evaluated per pass, newest first
max_trigger_age_minutes = 5  # an older breakout is a different trade

[plan]
stop = "or-mid"   # trader-exit --stop: or-mid | or-low | pct:X | atr:K
target = "2R"     # trader-exit --target: 1R | 1.5R | 2R | price:X

[filters]
news_hours = 12
block_news_tags = ["halt", "legal", "regulatory", "risk"]
block_important_filings = true          # 8-K items like 2.02, 5.02, 4.02, 1.03
block_verdicts = ["toward the stop"]    # Time Machine verdicts that skip the trade
min_history_triggers = 10               # the rule must have fired this often in 60 days

# Written into trader/config.json for the skills (trader-budget, trader-risk, ...).
# Anything left out keeps trader-budget's config.example.json value.
[limits]
budget = 5000
cash_buffer_pct = 10
max_loss_per_trade_usd = 50
max_daily_loss_usd = 150
max_trades_per_day = 3
min_reward_risk = 1.0
no_entries_before = "09:45"
no_entries_after = "15:30"
flat_by = "15:55"
# sec_user_agent = "Your Name you@example.com"   # or the SEC_USER_AGENT environment variable
